function lanePath(P,T){const out=[];let pz=onH(P);

  if(Math.abs(pz-T.z)<.03){out.push(T);return out}
  let best=null,bl=1e9;for(const a of AISLES){if(Math.min(pz,T.z)<a.z0-.03||Math.max(pz,T.z)>a.z1+.03)continue;const l=Math.abs(P.x-a.x)+Math.abs(T.x-a.x);if(l<bl){bl=l;best=a}}
  if(!best){out.push(T);return out}
  const ax=best.x+(T.z>pz?.24:-.24);out.push(new V3(ax,0,pz),new V3(ax,0,T.z),T);return out}
function goTo(A,to){const T=A.trip,P=A.pos.clone();let pre=[],start;
  const onQ=Math.abs(P.z-LANE.q)<.05;
  if(onQ&&to.q){A.trip={to,pts:[to.p.clone()],i:0,e:0,l:0};return}
  if(onQ){start=new V3(P.x,0,LANE.walk);pre=[start]}
  else if(T.i>=T.pts.length){pre=T.to.via.slice().reverse();start=T.to.via[0]}
  else if(T.i<T.e){pre=T.pts.slice(T.i,T.e);start=T.pts[T.e-1]}
  else if(T.i<T.l)start=P;
  else{pre=T.pts.slice(T.l-1,T.i).reverse();start=T.pts[T.l-1]}
  const lane=lanePath(start,to.via[0]),enter=to.via.slice(1).concat([to.p]);
  A.trip={to,pts:[...pre,...lane,...enter].map(v=>v.clone()),i:0,e:pre.length,l:pre.length+lane.length}}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const clock=new THREE.Clock();
let scrT=0,dcT=0;

function tick(){
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,k=1-Math.exp(-dt*9),am=reduce?.3:1;

  for(const A of agents){const b=A.body,a=A.anim,D=dest(A);if(D!==A.trip.to)goTo(A,D);

    if(pose==='slump'){tgt.a0=tgt.a1=-.4;tgt.head=.5;tgt.lean=.16}
    if(pose==='wave'){tgt.z1=2.5;tgt.head=-.16}

    const s=A.slotObj,n=A.st==='working'&&!walking&&D===s.home?A.subs.length:0;while(A.minis.length<A.subs.length)A.minis.push(mini(A));
    A.minis.forEach((m,j)=>{const on=j<n?1:0;m.s+=(on-m.s)*k*.6;m.b.g.visible=m.s>.02;m.b.g.scale.setScalar(Math.max(.001,m.s)*(s.kind==='gym'?.36:.28));
      const q=Math.sin(t*(s.kind==='gym'?12:9)+j*1.7);
