<title>Agent Office</title>
<style>
:root{--bg:#EDEFF2;--panel:#FFFFFF;--soft:#F5F6F8;--ink:#111827;--ink2:#374151;--muted:#6B7280;--faint:#9CA3AF;--line:#E6E8EC;--line2:#F0F1F4;--accent:#1B34FF;--accent-soft:#EEF0FF;--needs:#F59E0B;--needs-ink:#8A4B06;--needs-bg:#FFF7E8;--ok:#15A34A;--danger:#DC2626;color-scheme:light}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Geist,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage,#labels{position:fixed;inset:0}
#labels{pointer-events:none}
#stage canvas{display:block;touch-action:none}
.bar{position:fixed;z-index:5;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;max-width:calc(100vw - 32px - var(--drawer-w,0px))}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.brand h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.tally{display:flex;gap:2px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tc{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:4px 8px;border-radius:8px}
.tc:hover{background:var(--soft);color:var(--ink)}
.tc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tc b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tc[aria-pressed="true"]{background:var(--ink);color:#fff}
.tc[aria-pressed="true"] b{color:#fff}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sd.working{background:var(--accent)}.sd.needs{background:var(--needs)}.sd.done{background:var(--ok)}.sd.idle{background:#B9BFC9}.sd.stuck{background:var(--danger)}
.tbtn{font:500 12px Geist,system-ui,sans-serif;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.tbtn:hover{border-color:#CBD0D8;color:var(--ink)}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dir{position:fixed;z-index:6;left:16px;top:calc(68px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(17,24,39,.1);padding:8px}
.dept{padding:6px 4px 8px}
.dept+.dept{border-top:1px solid var(--line)}
.dept h3{margin:4px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dept h3 .dd{width:8px;height:8px;border-radius:2px}
.dept h3 i{margin-left:auto;font-style:normal;font-family:"JetBrains Mono",monospace;letter-spacing:0;text-transform:none;color:var(--faint)}
.row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer}
.row:hover{background:var(--soft)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.av{width:22px;height:22px;border-radius:50%;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.25);flex:none}
.av::before,.av::after{content:"";position:absolute;top:6px;width:6px;height:7px;border-radius:50%;background:radial-gradient(circle at 50% 62%,#15171c 0 36%,transparent 39%),#fff}
.av::before{left:4px}.av::after{right:4px}
.row .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stt{font:11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.row .stt.needs{color:var(--needs-ink);background:var(--needs-bg);padding:1px 6px;border-radius:5px}
.row .stt.working{color:var(--accent)}
.row .stt.stuck{color:var(--danger)}
.row.new .nm{color:var(--muted)}
.row.new .av{background:transparent;border:1.5px dashed #C3C8D0;box-shadow:none;display:grid;place-items:center;color:var(--faint);font-size:14px;line-height:1;box-sizing:border-box}
.row.new .av::before,.row.new .av::after{display:none}
#drawer{position:fixed;z-index:7;top:12px;right:12px;bottom:12px;width:var(--drawer-w,400px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 18px 44px rgba(17,24,39,.1);display:flex;flex-direction:column;overflow:hidden}
.dh{padding:14px 12px 10px 16px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center}
.dh .av{width:34px;height:34px}
.dh .av::before,.dh .av::after{top:10px;width:9px;height:10px}
.dh .av::before{left:7px}.dh .av::after{right:7px}
.dh .av.new{background:transparent;border:1.5px dashed #C3C8D0;box-shadow:none;box-sizing:border-box;display:grid;place-items:center;color:var(--faint);font-size:18px}
.dh .av.new::before,.dh .av.new::after{display:none}
.dh h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font:11.5px "JetBrains Mono",monospace;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap}
.meta .dd{width:7px;height:7px;border-radius:2px;flex:none}
.meta .wt{overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px}
.ib{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{color:var(--ink);background:var(--soft)}
.ib:focus-visible{outline:2px solid var(--accent)}
.ib svg{width:15px;height:15px}
.sbar{display:flex;gap:10px;align-items:center;padding:0 16px 12px;border-bottom:1px solid var(--line);font:11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;overflow:hidden}
.sbar .sp{flex:1}
.add{color:var(--ok)}.del{color:var(--danger)}
.pill{font:500 11px "JetBrains Mono",monospace;padding:2px 8px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.pill.working{background:var(--accent-soft);color:var(--accent)}
.pill.needs{background:var(--needs);color:#241300}
.pill.done{background:#E8F7EE;color:#0F7A38}
.pill.idle{background:var(--soft);color:var(--muted)}
.pill.stuck{background:#FDECEC;color:#B42318}
.pill.working::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.msg-u{align-self:flex-end;max-width:85%;background:var(--soft);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13px;color:var(--ink)}
.msg-a{font-size:13.5px;color:var(--ink2);line-height:1.6}
.msg-a code{font:12px "JetBrains Mono",monospace;background:var(--soft);border:1px solid var(--line2);padding:0 5px;border-radius:5px}
.tools{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tool{display:grid;grid-template-columns:6px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;font:12px/1.45 "JetBrains Mono",monospace}
.tool+.tool{border-top:1px solid var(--line2)}
.td{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tool[data-s="run"] .td{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.tool[data-s="bad"] .td{background:var(--danger)}
.tool[data-s="deny"] .td{background:#D1D5DB}
.tn{color:var(--ink);font-weight:500}
.tp{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .dl{color:var(--faint)}
.tr{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.tr.bad{color:var(--danger)}.tr.run{color:var(--accent)}
.subs{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.subs .h{display:flex;justify-content:space-between;padding:7px 12px;font:11px "JetBrains Mono",monospace;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.sub{display:grid;grid-template-columns:16px auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;font-size:12.5px}
.sub+.sub{border-top:1px solid var(--line2)}
.sub .mini{width:16px;height:16px}
.sub .mini::before,.sub .mini::after{top:4px;width:4px;height:5px}
.sub .mini::before{left:3px}.sub .mini::after{right:3px}
.sub b{font:500 12px "JetBrains Mono",monospace;color:var(--ink)}
.sub .sx{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .ss{font:11px "JetBrains Mono",monospace;color:var(--accent);display:flex;gap:6px;align-items:center;white-space:nowrap}
.sub .ss::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
.note{font:11px "JetBrains Mono",monospace;color:var(--muted);text-align:center}
.live{display:flex;gap:8px;align-items:center;font:12px "JetBrains Mono",monospace;color:var(--accent)}
.live .sk{animation:pulse 1.6s ease-in-out infinite}
.live .lt{color:var(--faint)}
.ask{border:1px solid #F5C66B;background:var(--needs-bg);border-radius:12px;padding:12px;display:grid;gap:10px;margin:0 16px 12px}
.ask .ah{display:flex;gap:10px;align-items:flex-start}
.ask .ai{width:20px;height:20px;border-radius:50%;background:var(--needs);color:#241300;display:grid;place-items:center;font:600 12px Geist,sans-serif;flex:none;margin-top:1px}
.ask .q{font-size:13.5px;font-weight:600;color:var(--ink)}
.ask .qs{font-size:12px;color:var(--needs-ink)}
.ask code{font:12px/1.5 "JetBrains Mono",monospace;background:#fff;border:1px solid #F1DDB4;border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;display:block;color:var(--ink)}
.ask code .dl{color:var(--faint)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{font:500 12px Geist,system-ui,sans-serif;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.b:hover{border-color:#CBD0D8}
.b.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.b.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b svg{width:11px;height:11px}
kbd{font:500 10.5px "JetBrains Mono",monospace;padding:0 5px;border-radius:4px;line-height:17px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.b.primary kbd,.b.accent kbd{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.85)}
.comp{border-top:1px solid var(--line);padding:12px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.comp textarea{font:13.5px/1.5 Geist,system-ui,sans-serif;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;max-height:140px;color:var(--ink);background:#fff;outline:none}
.comp textarea:focus{border-color:#AEB6FF;box-shadow:0 0 0 3px var(--accent-soft)}
.crow{display:flex;gap:6px;align-items:center}
.chipsel{font:11px "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 8px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crow .b{flex:none}
.crow .sp{flex:1}
.hint{font:11px "JetBrains Mono",monospace;color:var(--faint);display:flex;gap:14px}
.hint span{display:inline-flex;gap:5px;align-items:center}
.chip{position:relative;font:500 11px "JetBrains Mono",ui-monospace,monospace;display:flex;align-items:center;padding:4px 10px 4px 4px;border-radius:11px;background:rgba(255,255,255,.96);border:1px solid var(--line);color:var(--ink);white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 1px 3px rgba(17,24,39,.1);transition:translate .15s,padding .2s ease,opacity .2s}
.chip{translate:0 var(--lift,0px)}
.chip:hover{translate:0 calc(var(--lift,0px) - 2px)}
.chip .cd{position:relative;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.chip .cs{position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff;display:none}
.chip .tx{display:grid;max-width:172px;margin-left:7px;overflow:hidden;transition:max-width .22s ease,margin .22s ease}
.chip .tt{font:500 11.5px/15px Geist,system-ui,sans-serif;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis}
.chip .dn{font:400 10px/13px "JetBrains Mono",ui-monospace,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.chip.working .dn{color:var(--accent)}.chip.needs .dn{color:var(--needs-ink)}.chip.done .dn{color:#0F7A38}.chip.stuck .dn{color:var(--danger)}
.chip .ex{margin-left:8px;color:var(--muted)}
.chip.needs{background:var(--needs-bg);border-color:var(--needs)}
.chip.stuck{border-color:#F2B8B5}
.chip.idle .tt{color:var(--ink2)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 1px 3px rgba(17,24,39,.1)}
.chip.dim{opacity:.28}
.chip.min{padding:3px}
.chip.min .tx{max-width:0;margin-left:0}
.chip.min .ex{display:none}
#labels.far .chip .dn{display:none}
.chip.min .cs{display:block}
.chip.hid{opacity:0;pointer-events:none}
#labels.far .chip.min{padding:2px}
#labels.far .chip.min .cd{width:10px;height:10px}
#labels.far .chip.min .cs{width:5px;height:5px;border-width:1px;right:-2px;bottom:-2px}
#labels.far .chip.new{opacity:0;pointer-events:none}
.chip.working .cs{background:var(--accent)}.chip.done .cs{background:var(--ok)}.chip.idle .cs{background:#B9BFC9}.chip.stuck .cs{background:var(--danger)}
.sign{all:unset;box-sizing:border-box;pointer-events:auto;cursor:pointer;display:grid;padding:6px 10px 7px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(17,24,39,.08);white-space:nowrap;transition:opacity .2s,border-color .2s,box-shadow .2s}
.sign .sn{display:flex;gap:7px;align-items:center;font:600 12.5px/17px Geist,system-ui,sans-serif;color:var(--ink);letter-spacing:-.01em}
.sign .sn i{width:8px;height:8px;border-radius:2px;background:var(--ac)}
.sign .sp{font:400 10px/14px "JetBrains Mono",monospace;color:var(--muted)}
.cts{display:flex;gap:9px;font:500 11px/16px Geist,system-ui,sans-serif;color:var(--ink2);font-variant-numeric:tabular-nums}
.cts span{display:inline-flex;gap:4px;align-items:center}
.cts .sd{width:6px;height:6px}
.cts .needs{color:#B45309;font-weight:600}.cts .stuck{color:#B42318}
.sign .cts{margin-top:2px}
.sign:hover,.sign.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 14%,transparent),0 2px 6px rgba(17,24,39,.08)}
.sign.dim{opacity:.4}
.sign:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#labels.far .sign{padding:4px 7px 5px}
#labels.far .sign .sn{font-size:11px;line-height:15px}
#labels.far .sign .sp,#labels.far .cts em{display:none}
#labels.far .cts{gap:6px;font-size:10px;line-height:14px}
.bang{position:absolute;left:50%;bottom:calc(100% + 7px);margin-left:-13px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--needs);color:var(--needs);display:grid;place-items:center;font:700 15px Geist,sans-serif;box-shadow:0 2px 8px rgba(245,158,11,.35);box-sizing:border-box;animation:hop 1.1s ease-in-out infinite;pointer-events:none}
@keyframes hop{50%{translate:0 -4px}}
.chip.new{background:rgba(255,255,255,.8);border-style:dashed;border-color:#BFC5CE;color:var(--faint);padding:0;width:22px;height:22px;justify-content:center;font-size:14px;overflow:hidden;transition:width .18s ease,translate .15s,color .15s}
.chip.new span{display:none}
.chip.new:hover{width:auto;padding:3px 10px;color:var(--ink2);border-color:#9AA2AE}
.chip.new:hover span{display:inline}
#toast{position:fixed;z-index:9;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font:500 12px Geist,sans-serif;padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:none}
.sample{position:fixed;z-index:4;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:11px "JetBrains Mono",monospace;color:var(--muted)}
.field{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.field textarea{font:13.5px/1.5 Geist,system-ui,sans-serif;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);background:#fff;outline:none}
.field textarea:focus{border-color:#AEB6FF;box-shadow:0 0 0 3px var(--accent-soft)}
.field select{font:13px Geist,system-ui,sans-serif;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nwinfo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:11.5px/1.7 "JetBrains Mono",monospace;color:var(--muted)}
.nwinfo b{font-weight:500;color:var(--ink2)}
.hbtns{align-items:center}
.chip .qn{font:600 10px/14px "JetBrains Mono",monospace;color:var(--needs-ink);padding:0 4px 0 3px;font-variant-numeric:tabular-nums}
.chip.q{border-color:#F3C77A}
.chip.needs .cs{display:none!important}
#labels.far .chip .qn{display:none}
#labels.far .bang{width:20px;height:20px;margin-left:-10px;font-size:12px;border-width:1.5px;bottom:calc(100% + 5px)}
.strip{flex:none;display:flex;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.qtabs{position:relative;flex:1;min-width:0;display:flex;gap:6px;align-items:center;padding:4px 0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.qtabs::-webkit-scrollbar{display:none}
.strip .back{all:unset;cursor:pointer;flex:none;font:500 12px Geist,system-ui,sans-serif;color:var(--muted);height:28px;padding:0 8px 0 4px;border-radius:8px;display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.strip .back:hover{background:var(--soft);color:var(--ink)}
.strip .back svg{width:14px;height:14px}
.strip .back:focus-visible,.qt:focus-visible,.qi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ql{flex:none;font:500 10.5px "JetBrains Mono",monospace;color:var(--needs-ink);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;padding:0 4px 0 8px}
.strip .back+.qtabs{border-left:1px solid var(--line)}
.ql::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--needs)}
.ql.clear{color:var(--muted)}.ql.clear::before{background:var(--ok)}
.qt{all:unset;box-sizing:border-box;cursor:pointer;flex:none;position:relative;width:32px;height:32px;border-radius:10px;border:1px solid transparent;display:grid;place-items:center}
.qt:hover{background:var(--soft)}
.qt[aria-current="true"]{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qt .n{position:absolute;right:-4px;bottom:-4px;font-size:9px;padding:1px 3px;border-radius:4px}
.n{flex:none;font:500 10px/1 "JetBrains Mono",monospace;color:var(--needs-ink);background:var(--needs-bg);border:1px solid #F3D9A6;border-radius:5px;padding:2px 4px;font-variant-numeric:tabular-nums}
.strip .qh{flex:none;display:flex;gap:3px}
.meta .qp{color:var(--needs-ink);font-weight:500}
.b.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.ih{padding:16px 16px 13px;border-bottom:1px solid var(--line)}
.ih h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ih h2 i{width:8px;height:8px;border-radius:50%;background:var(--needs)}
.ih h2 i.clear{background:var(--ok)}

    const vt=Math.min(rem>6?2.1:1.6,.35+rem*1.5);A.spd+=(vt-A.spd)*(1-Math.exp(-dt*4));const step=Math.min(dl,A.spd*dt);
    if(dl>1e-4){A.pos.x+=dx/dl*step;A.pos.z+=dz/dl*step;if(dl>.03)a.face+=wrap(Math.atan2(dx,dz)-a.face)*(1-Math.exp(-dt*9))}
    if(dl-step<.02)A.path.shift();walking=A.path.length>0}
  else if(!A.path.length){A.spd=0;A.pos.x+=(S.p.x-A.pos.x)*Math.min(1,dt*8);A.pos.z+=(S.p.z-A.pos.z)*Math.min(1,dt*8);a.face+=wrap((S.face??faceCam(A.pos))-a.face)*(1-Math.exp(-dt*6))}
  const pose=walking?'walk':rising?'stand':S.pose,T=POSE[pose],sdt=Math.min(dt,.033);
  spr(a,'y',walking||rising?0:(S.y||0),sdt,13);for(const k of PK)spr(a,k,T[k],sdt,9.5);
  let lo=0,ao=0,bob=0,roll=0;
  if(walking){a.cyc+=dt*(3+A.spd*4.4);const s=Math.sin(a.cyc);lo=s*.6;ao=-s*.5;bob=Math.abs(Math.cos(a.cyc))*.045;roll=s*.06}
  else if(pose==='run'&&!rising){a.cyc+=dt*13;const s=Math.sin(a.cyc);lo=s*.95;ao=-s*.9;bob=Math.abs(Math.cos(a.cyc))*.06;roll=s*.04}
  lo*=am;ao*=am;bob*=am;roll*=am;
  if(A.born<1){A.born=Math.min(1,A.born+dt*2.2);const u=A.born,c=1.9;b.g.scale.setScalar(Math.max(.001,1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)))}
  b.g.position.set(A.pos.x,a.y+bob,A.pos.z);b.g.rotation.y=a.face;
  const home=!walking&&!A.path.length&&S.p===A.slotObj.seat,nd=A.st==='needs',pu=nd?.5+.5*Math.sin(t*4.2)*am:0;A.rr+=((home?A.slotObj.kind==='desk'?.95:.72:.42)-A.rr)*Math.min(1,dt*5);
  A.ring.position.set(A.pos.x,.016,A.pos.z);A.ring.scale.setScalar(A.rr*(1+pu*.06)*Math.min(1,b.g.scale.x));A.ring.material.opacity=(nd?.6+.4*pu:.92)*(isDim(A)?.22:1);
  b.legs[0].rotation.x=a.legs+lo;b.legs[1].rotation.x=a.legs-lo;
  const typ=pose==='type'?Math.sin(t*15+A.ph)*.12*am*(Math.sin(t*.9+A.ph)>-.4?1:0):0,rub=pose==='relax'?Math.sin(t*3.2)*.18*am:0;
  b.arms[0].rotation.x=a.a0+ao+typ;b.arms[1].rotation.x=a.a1-ao-typ+rub;
  b.arms[0].rotation.z=a.z0;b.arms[1].rotation.z=a.z1+(pose==='wave'?Math.sin(t*9)*.35*am:0);
  b.hips.rotation.set(a.lean,pose==='lean'?Math.sin(t*.8+A.ph)*.06*am:0,roll);
  b.hips.position.y=.17+(pose==='wave'?Math.abs(Math.sin(t*4.5))*.06*am:0);
  const br=Math.sin(t*2.1+A.ph)*(pose==='slump'?.03:.018)*am;b.body.scale.set(1-br*.5,1+br,1-br*.5);
  const look=(A===sel||A===hov)&&!walking?clamp(wrap(faceCam(A.pos)-a.face),-.55,.55)*.75:0;spr(a,'turn',look,sdt,6);
  b.hp.rotation.set(a.head+(pose==='slump'?Math.sin(t*.8+A.ph)*.05*am:0)+(pose==='type'?Math.sin(t*1.7+A.ph)*.03*am:0),a.turn,0);
  if(t>=A.nextBlink){A.blinkAt=t;A.nextBlink=t+(Math.random()<.15?.3:2+Math.random()*4)}
  const bu=(t-A.blinkAt)/.15,bf=bu<1?1-Math.sin(bu*Math.PI)*.92:1,ey=1.22*a.eye*bf;b.eyes[0].scale.y=b.eyes[1].scale.y=ey;

const clock=new THREE.Clock();let scrT=0;
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  scrT+=dt;if(scrT>.2){scrT=0;for(const A of agents)if(A.st==='working'){A.scroll++;drawScreen(A)}}
  for(const s of deskSlots)if(s.belt&&s.occupied?.st==='working'&&!s.occupied.path.length&&s.occupied.qk<0)s.belt.offset.y-=dt*1.9;
  for(const A of agents)animAgent(A,dt,t);
  camStep(dt);controls.update();drawClockHands();layoutChips();composer.render();labels.render(scene,camera);for(const A of agents)if(!A.chipMin)A.chipEl.style.zIndex=String(1000+(+A.chipEl.style.zIndex||0))}

setInterval(()=>{const pool=agents.filter(a=>a!==sel&&a.qk<0&&a.st!=='stuck'),A=pool[Math.floor(Math.random()*pool.length)];if(!A)return;const r=Math.random();let nx=A.st;
  if(A.st==='working')nx=r<(queue.length<3?.3:.05)?'needs':r<.62?'done':'working';else if(A.st==='done')nx=r<.5?'idle':'working';else nx=r<.55?'working':'idle';
  if(nx!==A.st)setState(A,nx)},7000);
setInterval(()=>{agents.forEach(A=>{A.t++;renderChip(A)});if(!dirEl.hidden)renderDir();if(mode==='chat'&&document.activeElement?.id!=='reply')renderDrawer(true)},60000);
setInterval(()=>{hist.push(agents.filter(a=>a.st==='working'||a.st==='needs').length);hist.shift();drawStatus()},10000);

DEPTS.forEach(mkSign);

deskSlots.forEach(s=>{if(!s.occupied)newChip(s)});
renderTally();drawStatus();drawMy();

Promise.all(['600 40px Geist','500 20px Geist','500 20px "JetBrains Mono"'].map(f=>document.fonts.load(f))).catch(()=>{}).then(()=>{agents.forEach(drawScreen);drawStatus();drawMy();qMarks.forEach(drawQ);deskSlots.forEach(drawPlate);renderSigns();drawBoard()});
