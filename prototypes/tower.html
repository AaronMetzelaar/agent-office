function logHTML(A){return A.log.map(([k,v])=>{
  if(k==='u')return`<div class="msg-u">${v}</div>`;
  if(k==='a')return`<div class="msg-a">${v}</div>`;
  if(k==='n')return`<div class="note">${v}</div>`;
  if(k==='t')return`<div class="tools">${v.map(([n,p,r])=>`<div class="tool"><span class="tn">${n}</span><span class="tp">${p}</span><span class="tr ${/^\+/.test(r)||/passed|closed/.test(r)?'add':/fail/.test(r)?'bad':''}">${r}</span></div>`).join('')}</div>`;
  if(k==='s')return A.st==='working'&&A.subs.length?`<div class="subs"><div class="h">${A.subs.length} subagent${A.subs.length>1?'s':''} running</div>${A.subs.map(s=>`<div class="sub"><span class="mini" style="background:${hexCss(A.color)}"></span>${s}<span class="ss">working</span></div>`).join('')}</div>`:'';
  return''}).join('')}

function renderDrawer(keepScroll){
  if(dmode==='new'&&newSlot){const d=newSlot.d,f=d.floor;drawer.hidden=false;drawer.innerHTML=`<div class="dh"><span class="av" style="background:${hexCss(COLORS[colorIx%COLORS.length])}"></span><div><h2>New agent in ${d.name}</h2><div class="meta">floor ${f.key} · ${d.path} · ${d.acct} account</div></div><div class="hbtns"><button type="button" class="ib" data-act="close" aria-label="Close">${ICON.close}</button></div></div>

  const L=drawer.querySelector('.log');L.scrollTop=st??L.scrollHeight}
drawer.addEventListener('click',e=>{const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;const A=sel;

function openNew(s){sel=null;agents.forEach(renderChip);dmode='new';newSlot=s;renderDrawer();layout();go({k:'floor',L:s.L})}

  const s=newSlot,words=v.replace(/[^\w\s-]/g,'').split(/\s+/).filter(Boolean).slice(0,4).join(' ')||'New task';const title=words.charAt(0).toUpperCase()+words.slice(1);
  const A=addAgent({d:s.d.id,slot:s.i,title,wt:title.toLowerCase().replace(/\s+/g,'-'),st:'working',t:0,subs:[],log:[['u',v.replace(/</g,'&lt;')],['a','Starting in <code>'+s.d.path+'</code>. I\'ll set up a worktree first.']]},true);

function setState(A,st){A.st=st;A.t=0;if(st==='needs'){const[tl,a]=ASKS[Math.floor(Math.random()*ASKS.length)];A.tool=tl;A.ask=a}

function cast(e,list){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);return ray.intersectObjects(list,false)[0]?.object}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function liftTick(dt){
  if(!lift.J&&lift.q.length){lift.J=lift.q.shift();lift.to=lift.J.trip.from;lift.ph='go1'}
  const J=lift.J,st=J?.trip?.stage;
  if(lift.ph==='go1'||lift.ph==='go2'){const ty=fy(lift.to),d=ty-lift.y;lift.dir=Math.sign(d);lift.y+=Math.sign(d)*Math.min(Math.abs(d),dt*Math.min(3.4,.7+Math.abs(d)*1.3));
    if(Math.abs(ty-lift.y)<.003){lift.y=ty;lift.dir=0;lift.open=lift.to;lift.ph=lift.ph==='go1'?'open1':'open2';renderDisp()}
    else{const nl=levelAt(lift.y);if(nl!==lift.shown){lift.shown=nl;renderDisp()}}}
  else if(lift.ph==='open1'){if(doorAmt[lift.to]>.92&&st==='wait'){J.trip.stage='enter';J.path=[new V3(LX,0,LZ+.1)]}if(st==='ride'){lift.open=null;lift.ph='close1'}}
  else if(lift.ph==='close1'){if(doorAmt[lift.to]<.03){lift.to=J.trip.to;lift.ph='go2'}}
  else if(lift.ph==='open2'){if(doorAmt[lift.to]>.92&&st==='ride'){J.riding=false;J.level=lift.to;J.trip.stage='exit';const S=spot(J);J.path=[new V3(LX,0,.6),new V3(7.2,0,AISLE),...S.via,S.p];J.cur=S}
    if(st!=='ride'&&J.pos.z>.2){lift.open=null;lift.ph='close2'}}
  else if(lift.ph==='close2'){if(doorAmt[lift.to]<.03){lift.J=null;lift.ph='idle'}}
  const k=1-Math.exp(-dt*4.5);
  FLOORS.forEach(f=>{const a=doorAmt[f.L]+=((lift.open===f.L?1:0)-doorAmt[f.L])*k;f.doors[0].position.x=8.3-.49*a;f.doors[1].position.x=8.8+.49*a});
  cab.position.y=lift.y;const top=TOPY+.3,bot=lift.y+2.38;cable.scale.y=top-bot;cable.position.y=(top+bot)/2}
function moveAgent(A,dt,t,k,am){const b=A.body,a=A.anim,S=spot(A);
  if(!A.trip){if(S.k!==A.cur.k)A.path=[...A.cur.via.slice().reverse(),...S.via,S.p];A.cur=S}
  let pose=S.pose,face=S.face,walking=false;
  if(A.path.length){const p=A.path[0],to=new V3(p.x-A.pos.x,0,p.z-A.pos.z),dist=to.length();
    if(dist<.05)A.path.shift();else{walking=true;pose='walk';A.pos.addScaledVector(to.normalize(),Math.min(dist,dt*1.9));a.face+=wrap(Math.atan2(to.x,to.z)-a.face)*Math.min(1,k*1.6)}}
  if(!walking){
    if(A.trip){pose='stand';face=A.trip.stage==='wait'?Math.PI:0;
      if(!A.path.length){if(A.trip.stage==='walk'){A.trip.stage='wait';lift.q.push(A)}else if(A.trip.stage==='enter'){A.trip.stage='ride';A.riding=true}else if(A.trip.stage==='exit')A.trip=null}}
    else if(!A.path.length){const to=new V3(S.p.x-A.pos.x,0,S.p.z-A.pos.z),dist=to.length();
      if(dist>.05){walking=true;pose='walk';A.pos.addScaledVector(to.normalize(),Math.min(dist,dt*1.9));a.face+=wrap(Math.atan2(to.x,to.z)-a.face)*Math.min(1,k*1.6)}else{A.pos.x=S.p.x;A.pos.z=S.p.z}}
    if(!walking)a.face+=wrap(face-a.face)*k*.8}
  const seated=!walking&&SEATED.includes(pose);
  const ty=(seated?.26:0)+(!walking&&pose==='run'?.15:0);a.y+=(ty-a.y)*k;
  b.g.position.set(A.pos.x,baseY(A)+a.y,A.pos.z);b.g.rotation.y=a.face;
  const tgt={legs:seated?-1.45:0,a0:0,a1:0,z0:-.12,z1:.12,head:0,lean:0};
  if(pose==='type'){tgt.a0=tgt.a1=-1.15;tgt.head=.14;tgt.lean=.08}
  if(pose==='lean'){tgt.a0=tgt.a1=-.25;tgt.z0=-.4;tgt.z1=.4;tgt.head=-.18;tgt.lean=-.16}
  if(pose==='slump'){tgt.a0=tgt.a1=-.4;tgt.head=.5;tgt.lean=.16}
  if(pose==='sit'){tgt.a0=tgt.a1=-.7;tgt.head=.28;tgt.lean=.1}
  if(pose==='wave'){tgt.z1=2.5;tgt.head=-.12}
  if(pose==='relax'){tgt.a1=-2.1;tgt.z1=.25;tgt.head=-.22}
  if(pose==='run'){tgt.lean=.16}
  a.legs+=(tgt.legs-a.legs)*k;a.arm[0]+=(tgt.a0-a.arm[0])*k;a.arm[1]+=(tgt.a1-a.arm[1])*k;a.armZ[0]+=(tgt.z0-a.armZ[0])*k;a.armZ[1]+=(tgt.z1-a.armZ[1])*k;a.head+=(tgt.head-a.head)*k;a.lean+=(tgt.lean-a.lean)*k;
  const ph=A.slot*1.3;let lo=0,ao=0,bob=0;
  if(walking){const s=Math.sin(t*9+ph);lo=s*.6*am;ao=-s*.45*am;bob=Math.abs(Math.cos(t*9+ph))*.04*am}
  else if(pose==='run'){const s=Math.sin(t*13+ph);lo=s*.9*am;ao=-s*.8*am;bob=Math.abs(Math.cos(t*13+ph))*.06*am}
  b.legs[0].rotation.x=a.legs+lo;b.legs[1].rotation.x=a.legs-lo;
  const typ=pose==='type'?Math.sin(t*16+ph)*.13*am:0;
  b.arms[0].rotation.x=a.arm[0]+ao+typ;b.arms[1].rotation.x=a.arm[1]-ao-typ;
  b.arms[0].rotation.z=a.armZ[0];b.arms[1].rotation.z=a.armZ[1]+(pose==='wave'?Math.sin(t*9)*.35*am:0);
  b.hp.rotation.x=a.head+(pose==='slump'?Math.sin(t*.9+ph)*.04*am:0);b.hips.rotation.x=a.lean;
  b.hips.position.y=.22+bob+(pose==='wave'?Math.abs(Math.sin(t*4.5))*.05*am:0)+(pose==='slump'||pose==='sit'?Math.sin(t*1.4+ph)*.006:0);
  const n=A.st==='working'&&!A.trip?A.subs.length:0;while(A.minis.length<n)A.minis.push(mini(A));
  A.minis.forEach((m,j)=>{const on=j<n?1:0;m.s+=(on-m.s)*k*.6;m.b.g.scale.setScalar(Math.max(.001,m.s)*.42);m.b.g.visible=m.s>.02;
    const an=t*.55*am+j*2.1+ph,rx=1.05,rz=.22,px=A.slotObj.x+Math.cos(an)*rx,pz=1.2+Math.sin(an)*rz;m.b.g.position.set(px,fy(A.level),pz);m.b.g.rotation.y=Math.atan2(-Math.sin(an)*rx,Math.cos(an)*rz);
    const s=Math.sin(t*10+j);m.b.legs[0].rotation.x=s*.6*am;m.b.legs[1].rotation.x=-s*.6*am;m.b.arms[0].rotation.x=-s*.4*am;m.b.arms[1].rotation.x=s*.4*am;m.b.hips.position.y=.22+Math.abs(Math.cos(t*10+j))*.05})}
const pv=new V3();
function sx(o){pv.setFromMatrixPosition(o.matrixWorld).project(camera);return(pv.x+1)/2*W()}
function layoutChips(){const rows=new Map(),add=(key,it)=>{if(!rows.has(key))rows.set(key,[]);rows.get(key).push(it)};
  for(const A of agents)add(A.riding?'lift':A.level,{A,x:sx(A.chipObj)});
  for(const s of deskSlots)if(s.newObj)add(s.L,{x:sx(s.newObj)});
  for(const list of rows.values()){list.sort((p,q)=>p.x-q.x);list.forEach((it,i)=>{const A=it.A;if(!A)return;let w=400;
    for(const j of[i-1,i+1]){const nb=list[j];if(!nb)continue;const dx=Math.abs(nb.x-it.x);w=Math.min(w,nb.A?dx-12:2*(dx-8)-22)}
    const ttw=Math.min(150,Math.floor((w-50)/6)*6),c=ttw<40;
    if(A._ttw!==ttw){A._ttw=ttw;A.chipEl.style.setProperty('--ttw',Math.max(0,ttw)+'px')}
    if(A.compact!==c){A.compact=c;A.chipEl.classList.toggle('compact',c)}})}}
const amber=new THREE.Color(0xF59E0B),amberHi=new THREE.Color(0xFFD27A);
const clock=new THREE.Clock();
let scrT=0;
function tick(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,k=1-Math.exp(-dt*9),am=reduce?.3:1;
  scrT+=dt;if(scrT>.16){scrT=0;agents.forEach(A=>{if(A.st==='working'){A.scroll++;drawScreen(A)}})}
  deskSlots.forEach(s=>{if(s.belt&&s.occupied?.st==='working'&&!s.occupied.trip)s.belt.offset.y+=dt*1.6});
  liftTick(dt);
  for(const A of agents)moveAgent(A,dt,t,k,am);
  glide(dt);controls.update();clampTarget();
  FLOORS.forEach(f=>{if(f.needs)f.stripMat.color.copy(amber).lerp(amberHi,reduce?.2:(Math.sin(t*3.2)+1)*.3);else f.stripMat.color.copy(f.stripBase)});
  const ppu=H()/(2*camera.position.distanceTo(controls.target)*TAN),amt=THREE.MathUtils.clamp((ppu-40)/35,0,1)*2;
  tH.uniforms.h.value=amt/W();tV.uniforms.v.value=amt/H();tH.uniforms.r.value=tV.uniforms.r.value=.5+vw.offY/H();
  composer.render();layoutChips();labels.render(scene,camera);syncLift();
  requestAnimationFrame(tick)}
